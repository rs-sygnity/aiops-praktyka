name: CI/CD Kantyna

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-central-1
  EKS_CLUSTER: aiops

jobs:
  test-orders-api:
    name: Testy orders-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: app/orders-api/uv.lock
      - name: pytest
        working-directory: app/orders-api
        run: uv run pytest -q

  test-payments:
    name: Testy payments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/payments/go.mod
          cache-dependency-path: app/payments/go.sum
      - name: go test
        working-directory: app/payments
        run: go test ./...

  build-push:
    name: Build i push (${{ matrix.service }})
    if: github.event_name == 'push'
    needs: [test-orders-api, test-payments]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: [orders-api, payments, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/kantyna/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_VARIANT=stable
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Wdrożenie (helm)
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ vars.K8S_NAMESPACE }}
      cancel-in-progress: false
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Kubeconfig dla klastra EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: helm upgrade
        run: |
          helm version --short
          helm upgrade kantyna app/deploy/helm/kantyna \
            --namespace "$K8S_NAMESPACE" \
            --reuse-values \
            --set "global.imageRegistry=$ECR_REGISTRY" \
            --set "global.imageTag=$IMAGE_TAG"
      - name: rollout status
        run: |
          for svc in orders-api payments worker web; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/kantyna-$svc" --timeout=300s
          done
      - name: Smoke test /healthz (z wnętrza klastra)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          kubectl -n "$K8S_NAMESPACE" run "smoke-$RUN_ID" --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 --command -- sh -c '
              set -e
              curl -fsS --retry 5 --retry-connrefused --retry-delay 3 http://kantyna-orders-api:8000/healthz
              curl -fsS --retry 5 --retry-connrefused --retry-delay 3 http://kantyna-payments:8080/healthz
              curl -fsS --retry 5 --retry-connrefused --retry-delay 3 http://kantyna-web:8080/healthz
            '
